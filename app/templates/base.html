<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StartLine{% endblock %}</title>
    {% set page_description = "DFS projections, sportsbook betting lines, and expert consensus rankings, blended into one expected-points number for every player, every week." %}
    <meta name="description" content="{{ page_description }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StartLine">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="https://getstartline.com{{ request.url.path }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ self.title() }}">
    <meta name="twitter:description" content="{{ page_description }}">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ favicon_version }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/static/app.js?v={{ app_js_version }}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/style.css?v={{ style_version }}">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a class="nav-brand" href="/">
                <span class="nav-logo">SL</span>
                <span class="nav-wordmark">StartLine</span>
            </a>
            <div class="nav-links">
                <a href="/dashboard" class="{{ 'active' if active_page == 'dashboard' else '' }}">Dashboard</a>
                <a href="/compare" class="{{ 'active' if active_page == 'compare' else '' }}">Compare</a>
                <a href="/about" class="{{ 'active' if active_page == 'about' else '' }}">About</a>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
